name: CeDiRNet-6DoF-public
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.0
      - torchvision==0.22.0
      - torchaudio==2.7.0
      - future
      - numpy<2
      - opencv-python-headless>=4.9
      - Pillow>=9
      - pandas
      - scikit-learn
      - scikit-image
      - scipy
      # Keep the ECOS dependency used by loss weighting on the NumPy 1.x stack.
      - cvxpy>=1.5.4,<1.6
      - tensorboard
      - matplotlib
      - tqdm
      - PyYAML
      - termcolor
      - protobuf<5
      - segmentation-models-pytorch==0.3.2
      - timm==0.6.12
      - efficientnet-pytorch==0.7.1
      - pretrainedmodels==0.7.4

# OpenCV may additionally require libGL/libglib system packages outside Docker.
